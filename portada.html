<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d33">
  <meta name="description" content="Toca la invitación para abrir la celebración de nuestras Bodas de Oro.">
  <meta property="og:title" content="Bodas de Oro · 50 años de amor">
  <meta property="og:description" content="Toca la invitación para abrir la celebración de nuestras Bodas de Oro.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://leosaucedo300-afk.github.io/Boda-De-Oro/portada.html">
  <meta property="og:image" content="https://leosaucedo300-afk.github.io/Boda-De-Oro/portada-whatsapp.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="900">
  <title>Bodas de Oro · Abrir invitación</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="portada-bodas-de-oro.png">
  <link rel="prefetch" href="index.html">
  <link rel="stylesheet" href="css/portada.css">
</head>
<body>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="intro">
      <span class="intro-line">Bodas de Oro</span>
      <strong>26 · Diciembre · 2026</strong>
    </p>

    <div class="entry">
      <span class="aura" aria-hidden="true"></span>
      <a class="card" id="card" href="index.html" aria-label="Toca para abrir la invitación de Bodas de Oro">
        <span class="card-inner" id="cardInner">
          <img src="portada-bodas-de-oro.png" width="1024" height="1536"
               alt="Invitación de bodas de oro en azul marino y dorado, con un sobre y un sello dorado. 50 años de amor.">
          <span class="glare" aria-hidden="true"></span>
          <span class="sweep" aria-hidden="true"></span>
          <span class="spot spot-seal" aria-hidden="true"></span>
          <span class="spot spot-btn" aria-hidden="true"></span>
        </span>
      </a>
    </div>

    <p class="hint"><span class="hint-dot">✦</span> Toca el sello o el botón para abrir <span class="hint-dot">✦</span></p>
  </main>

  <div class="flash" aria-hidden="true"></div>

  <script src="js/oro.js"></script>
  <script src="js/portada.js"></script>
</body>
</html>
